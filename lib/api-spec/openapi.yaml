openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analyze
    description: Cybersecurity analysis operations
  - name: ask
    description: AI Q&A operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analyze:
    post:
      operationId: analyzeEvents
      tags: [analyze]
      summary: Analyze cybersecurity events from an Excel file
      description: Upload an Excel file (multipart/form-data with fields orgType and file) with cybersecurity events and receive an AI-powered risk analysis tailored to the organization type.
      responses:
        "200":
          description: Analysis completed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CyberAnalysis"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ask:
    post:
      operationId: askQuestion
      tags: [ask]
      summary: Ask a question about the current analysis
      description: Submit a natural-language question about the loaded cybersecurity analysis and receive an AI-generated answer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: Answer generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CyberEvent:
      type: object
      properties:
        eventType:
          type: string
        count:
          type: integer
        percentage:
          type: number
      required:
        - eventType
        - count
        - percentage

    ExploitProbability:
      type: object
      properties:
        eventType:
          type: string
        probability:
          type: number
          description: Probability from 0 to 1
        severity:
          type: string
          enum: [Low, Medium, High, Critical]
        rationale:
          type: string
      required:
        - eventType
        - probability
        - severity
        - rationale

    SecurityControl:
      type: object
      properties:
        eventType:
          type: string
        measures:
          type: array
          items:
            type: string
        frameworks:
          type: array
          items:
            type: string
          description: Relevant frameworks (e.g. ISO 27001, NIST, CIS)
      required:
        - eventType
        - measures
        - frameworks

    LossPotential:
      type: object
      properties:
        eventType:
          type: string
        minLossEur:
          type: number
        maxLossEur:
          type: number
        avgLossEur:
          type: number
        impactAreas:
          type: array
          items:
            type: string
      required:
        - eventType
        - minLossEur
        - maxLossEur
        - avgLossEur
        - impactAreas

    RawEvent:
      type: object
      properties:
        date:
          type: string
          nullable: true
          description: ISO date string of the event, or null if not detected
        eventType:
          type: string
          description: Detected event type or category
        category:
          type: string
          nullable: true
        severity:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        rawData:
          type: object
          additionalProperties:
            type: string
          description: All original column values from the row
      required:
        - date
        - eventType
        - category
        - severity
        - source
        - description
        - rawData

    CyberAnalysis:
      type: object
      properties:
        orgType:
          type: string
        totalEvents:
          type: integer
        analyzedAt:
          type: string
          format: date-time
        topEvents:
          type: array
          items:
            $ref: "#/components/schemas/CyberEvent"
        exploitProbabilities:
          type: array
          items:
            $ref: "#/components/schemas/ExploitProbability"
        controls:
          type: array
          items:
            $ref: "#/components/schemas/SecurityControl"
        lossPotentials:
          type: array
          items:
            $ref: "#/components/schemas/LossPotential"
        executiveSummary:
          type: string
        riskScore:
          type: number
          description: Overall risk score 0-100
        riskLevel:
          type: string
          enum: [Low, Medium, High, Critical]
        rawEvents:
          type: array
          items:
            $ref: "#/components/schemas/RawEvent"
          description: All parsed events from the uploaded file
        eventTrends:
          type: array
          items:
            $ref: "#/components/schemas/EventTrend"
          description: Short-term forecast per event type for the next 15-30 days
      required:
        - orgType
        - totalEvents
        - analyzedAt
        - topEvents
        - exploitProbabilities
        - controls
        - lossPotentials
        - executiveSummary
        - riskScore
        - riskLevel
        - rawEvents
        - eventTrends

    AnalysisContext:
      type: object
      description: Summarised analysis data sent alongside a question
      properties:
        orgType:
          type: string
        totalEvents:
          type: integer
        riskScore:
          type: number
        riskLevel:
          type: string
        executiveSummary:
          type: string
        topEvents:
          type: array
          items:
            $ref: "#/components/schemas/CyberEvent"
        exploitProbabilities:
          type: array
          items:
            $ref: "#/components/schemas/ExploitProbability"
        lossPotentials:
          type: array
          items:
            $ref: "#/components/schemas/LossPotential"
      required:
        - orgType
        - totalEvents
        - riskScore
        - riskLevel
        - executiveSummary
        - topEvents
        - exploitProbabilities
        - lossPotentials

    EventTrend:
      type: object
      description: Short-term forecast for a specific event type
      properties:
        eventType:
          type: string
        trend:
          type: string
          enum: [rising, stable, falling]
          description: Whether this event type is increasing, stable, or decreasing in frequency
        probability15d:
          type: number
          description: Probability (0-1) of this event occurring in the next 15 days
        probability30d:
          type: number
          description: Probability (0-1) of this event occurring in the next 30 days
        avgIntervalDays:
          type: number
          description: Average number of days between occurrences
        lastOccurrence:
          type: string
          nullable: true
          description: ISO date of last known occurrence
        forecastDate:
          type: string
          nullable: true
          description: Estimated ISO date of next likely occurrence
        confidenceLevel:
          type: string
          enum: [Low, Medium, High]
          description: Confidence level of this forecast
        reasoning:
          type: string
          description: Brief explanation of the forecast rationale
      required:
        - eventType
        - trend
        - probability15d
        - probability30d
        - avgIntervalDays
        - lastOccurrence
        - forecastDate
        - confidenceLevel
        - reasoning

    AskRequest:
      type: object
      properties:
        question:
          type: string
          description: Natural-language question from the user
        context:
          $ref: "#/components/schemas/AnalysisContext"
      required:
        - question
        - context

    AskResponse:
      type: object
      properties:
        answer:
          type: string
        question:
          type: string
      required:
        - answer
        - question

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
